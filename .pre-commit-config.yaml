---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=50000000000000]
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
        files: ^requirements.*\.txt$
      - id: trailing-whitespace
      - id: check-toml
      - id: check-json
      - id: check-case-conflict  # File naming issues
      - id: check-docstring-first
      - id: check-executables-have-shebangs

  # Ruff: lint and format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Run the linter.
      - id: ruff
        types_or: [python, pyi, pyproject]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi, pyproject]

  # Static type checking
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.413
    hooks:
      - id: pyright

  # Dependencies security
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4  # Update me!
    hooks:
      - id: bandit
        additional_dependencies: ['bandit[toml]']
        args: [-c, pyproject.toml, --quiet, --format=custom]

  # Auditing packages for vulnerabilities
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.11
    hooks:
      - id: uv-lock  # keep uv.lock in sync when pyproject.toml changes
      - id: uv-audit  # scan locked dependency graph for known CVEs

  # ── YAML: format then lint ─────────────────────────────────────────────────
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  # Commit message quality
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
